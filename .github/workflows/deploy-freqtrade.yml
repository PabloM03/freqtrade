name: Deploy Freqtrade

on:
  push:
    branches: [ "develop" ]
    paths-ignore:
      - "README.md"
      - "CLAUDE.md"
      - ".claude/**"
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Preparar claves SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "${SSH_PORT}" "${SSH_HOST}" >> ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Sincronizar código al servidor con rsync (preservando estado del bot)
        env:
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          TARGET_DIR: ${{ secrets.TARGET_DIR }}
        run: |
          # IMPORTANTE: los --exclude van como opciones directas (NO en variable con comillas
          # embebidas) para que bash los procese correctamente y rsync reciba los patrones sin
          # comillas literales (bug previo: '*.sqlite' dentro de var = no matcheaba nada → --delete borraba el sqlite)
          rsync -az --delete \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='.gitignore' \
            --exclude='config.json' \
            --exclude='config.secrets.json' \
            --exclude='ops/config.withparams.json' \
            --exclude='ops/params.json' \
            --exclude='*.sqlite' \
            --exclude='*.sqlite-shm' \
            --exclude='*.sqlite-wal' \
            --exclude='logs/' \
            --exclude='user_data/data/' \
            --exclude='user_data/models/' \
            --exclude='user_data/hyperopt_results/' \
            --exclude='user_data/backtest_results/*.json' \
            --exclude='user_data/backtest_results/*.zip' \
            --exclude='__pycache__/' \
            --exclude='*/__pycache__/' \
            --exclude='CLAUDE.md' \
            --exclude='.claude/' \
            -e "ssh -i ~/.ssh/deploy_key -p ${SSH_PORT}" \
            ./ "${SSH_USER}@${SSH_HOST}:${TARGET_DIR}/"

      - name: Reiniciar servicio
        env:
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SERVICE_NAME: ${{ secrets.SERVICE_NAME }}
        run: |
          ssh -i ~/.ssh/deploy_key -p "${SSH_PORT}" "${SSH_USER}@${SSH_HOST}" \
            "sudo systemctl daemon-reload || true && sudo systemctl restart ${SERVICE_NAME} && sudo systemctl status ${SERVICE_NAME} -n 20 --no-pager"
