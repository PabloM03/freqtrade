name: Deploy Freqtrade

on:
  push:
    branches: [ "main" ]   # cámbialo si despliegas otra rama
    paths-ignore:
      - "README.md"
      - "**/*.md"
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Instalar rsync y ssh
        run: sudo apt-get update && sudo apt-get install -y rsync openssh-client

      - name: Preparar claves SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # Confiar en el host
          ssh-keyscan -p "${SSH_PORT}" "${SSH_HOST}" >> ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Crear estructura destino (si no existe)
        env:
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          TARGET_DIR: ${{ secrets.TARGET_DIR }}
        run: |
          ssh -i ~/.ssh/deploy_key -p "${SSH_PORT}" "${SSH_USER}@${SSH_HOST}" \
            "mkdir -p ${TARGET_DIR}/app ${TARGET_DIR}/config ${TARGET_DIR}/logs && ls -la ${TARGET_DIR}"

      - name: Sincronizar código al servidor con rsync
        env:
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          TARGET_DIR: ${{ secrets.TARGET_DIR }}
        run: |
          RSYNC_EXCLUDES="--exclude .git/ --exclude .github/ --exclude .gitignore --exclude config/config.json --exclude **/__pycache__/"
          rsync -az --delete $RSYNC_EXCLUDES \
            -e "ssh -i ~/.ssh/deploy_key -p ${SSH_PORT}" \
            ./ "${SSH_USER}@${SSH_HOST}:${TARGET_DIR}/app/"

      - name: Parar servicio antes de actualizar (opcional pero recomendado)
        env:
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SERVICE_NAME: ${{ secrets.SERVICE_NAME }}
        run: |
          ssh -i ~/.ssh/deploy_key -p "${SSH_PORT}" "${SSH_USER}@${SSH_HOST}" \
            "sudo systemctl stop ${SERVICE_NAME} || true"

      - name: Post-deploy (dependencias/scripts opcionales)
        if: always()
        env:
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          TARGET_DIR: ${{ secrets.TARGET_DIR }}
        run: |
          # Si necesitas algo como pip install, migrations, etc., hazlo aquí.
          # Ejemplos (descomenta/ajusta si aplica):
          # ssh -i ~/.ssh/deploy_key -p "${SSH_PORT}" "${SSH_USER}@${SSH_HOST}" \
          #   "cd ${TARGET_DIR}/app && /home/ubuntu/miniconda3/bin/python -m pip install -r requirements.txt --upgrade"
          #
          # Si tienes un script propio:
          # ssh -i ~/.ssh/deploy_key -p "${SSH_PORT}" "${SSH_USER}@${SSH_HOST}" \
          #   "bash ${TARGET_DIR}/app/scripts/prestart.sh || true"
          echo "Post-deploy: nada que ejecutar"

      - name: Reiniciar servicio
        env:
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SERVICE_NAME: ${{ secrets.SERVICE_NAME }}
        run: |
          ssh -i ~/.ssh/deploy_key -p "${SSH_PORT}" "${SSH_USER}@${SSH_HOST}" \
            "sudo systemctl daemon-reload || true && sudo systemctl start ${SERVICE_NAME} && sudo systemctl status ${SERVICE_NAME} -n 20 --no-pager"

      - name: Verificar proceso (sanity check)
        env:
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SERVICE_NAME: ${{ secrets.SERVICE_NAME }}
        run: |
          ssh -i ~/.ssh/deploy_key -p "${SSH_PORT}" "${SSH_USER}@${SSH_HOST}" \
            "sleep 2 && systemctl is-active --quiet ${SERVICE_NAME} && echo '✅ Servicio activo' || (echo '❌ Servicio NO activo' && exit 1)"

            - name: Verificar servicio y mostrar logs si falla
        env:
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SERVICE_NAME: ${{ secrets.SERVICE_NAME }}
        run: |
          set -e
          if ssh -i ~/.ssh/deploy_key -p "${SSH_PORT}" "${SSH_USER}@${SSH_HOST}" "systemctl is-active --quiet ${SERVICE_NAME}"; then
            echo "✅ ${SERVICE_NAME} está activo"
          else
            echo "❌ ${SERVICE_NAME} NO está activo. Mostrando últimos logs..."
            ssh -i ~/.ssh/deploy_key -p "${SSH_PORT}" "${SSH_USER}@${SSH_HOST}" \
              "sudo journalctl -u ${SERVICE_NAME} -n 120 --no-pager || true"
            exit 1
          fi
