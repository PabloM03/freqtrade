name: Deploy Freqtrade

on:
  push:
    branches: [ "develop" ]
    paths-ignore:
      - "README.md"
      - "**/*.md"
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Instalar rsync y ssh
        run: sudo apt-get update && sudo apt-get install -y rsync openssh-client

      - name: Preparar claves SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "${SSH_PORT}" "${SSH_HOST}" >> ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Crear estructura destino (si no existe)
        env:
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          TARGET_DIR: ${{ secrets.TARGET_DIR }}
        run: |
          ssh -i ~/.ssh/deploy_key -p "${SSH_PORT}" "${SSH_USER}@${SSH_HOST}" \
            "mkdir -p ${TARGET_DIR}/app ${TARGET_DIR}/config ${TARGET_DIR}/logs && ls -la ${TARGET_DIR}"

      - name: Generar marca de commit desplegado
        run: echo "${GITHUB_SHA}" > DEPLOYED_COMMIT

      - name: Sincronizar código al servidor con rsync
        env:
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          TARGET_DIR: ${{ secrets.TARGET_DIR }}
        run: |
          RSYNC_EXCLUDES="--exclude .git/ --exclude .github/ --exclude .gitignore \
                          --exclude config/config.json \
                          --exclude user_data/ \
                          --exclude logs/ \
                          --exclude **/__pycache__/"
          rsync -az --delete $RSYNC_EXCLUDES \
            -e "ssh -i ~/.ssh/deploy_key -p ${SSH_PORT}" \
            ./ "${SSH_USER}@${SSH_HOST}:${TARGET_DIR}/app/"

      - name: Copiar DEPLOYED_COMMIT al servidor
        env:
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          TARGET_DIR: ${{ secrets.TARGET_DIR }}
        run: |
          scp -i ~/.ssh/deploy_key -P "${SSH_PORT}" ./DEPLOYED_COMMIT \
            "${SSH_USER}@${SSH_HOST}:${TARGET_DIR}/app/DEPLOYED_COMMIT"

      - name: Reiniciar servicio
        env:
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SERVICE_NAME: ${{ secrets.SERVICE_NAME }}
        run: |
          ssh -i ~/.ssh/deploy_key -p "${SSH_PORT}" "${SSH_USER}@${SSH_HOST}" \
            "sudo systemctl daemon-reload || true && sudo systemctl restart ${SERVICE_NAME} && sudo systemctl status ${SERVICE_NAME} -n 20 --no-pager"

      - name: Verificar servicio (con logs si falla)
        env:
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SERVICE_NAME: ${{ secrets.SERVICE_NAME }}
          TARGET_DIR: ${{ secrets.TARGET_DIR }}   # <-- FALTABA
        run: |
          set -euo pipefail
          for i in {1..8}; do
            if ssh -i ~/.ssh/deploy_key -p "${SSH_PORT}" "${SSH_USER}@${SSH_HOST}" "systemctl is-active --quiet ${SERVICE_NAME}"; then
              echo "✅ ${SERVICE_NAME} está activo"
              ssh -i ~/.ssh/deploy_key -p "${SSH_PORT}" "${SSH_USER}@${SSH_HOST}" \
                "echo 'Corriendo commit:' && cat ${TARGET_DIR}/app/DEPLOYED_COMMIT || true"
              exit 0
            fi
            echo "Esperando arranque (${i}/8)..."
            sleep 3
          done
          echo "❌ ${SERVICE_NAME} NO está activo. Últimos logs:"
          ssh -i ~/.ssh/deploy_key -p "${SSH_PORT}" "${SSH_USER}@${SSH_HOST}" \
            "sudo journalctl -u ${SERVICE_NAME} -n 200 --no-pager || true"
          exit 1
